<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#f9f8f5">
<title>ROOIcapital® · Sitio en construcción</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root{
    --ink:#0e1543; --ink-soft:#4a5370; --muted:#6b7288;
    --gold:#ce8100; --gold-light:#e7ab42; --line:rgba(14,21,67,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    background:
      radial-gradient(1100px 620px at 50% -12%, rgba(231,171,66,.13), transparent 62%),
      radial-gradient(900px 600px at 110% 110%, rgba(27,38,112,.07), transparent 60%),
      linear-gradient(180deg,#fcfbf9 0%,#f7f5f1 100%);
    min-height:100vh;min-height:100svh;
    display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  main{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:56px 24px 40px;
  }
  .logo{width:min(78vw,320px);height:auto;display:block;margin:0 auto 44px;
    opacity:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) .05s forwards}
  .eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);
    font-weight:600;margin-bottom:14px;opacity:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) .2s forwards}
  h1{font-size:clamp(34px,9.2vw,60px);line-height:1.05;letter-spacing:-.025em;font-weight:700;
    opacity:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) .3s forwards}
  .flash{position:relative;width:min(220px,56vw);height:2px;margin:22px auto 24px;border-radius:2px;overflow:hidden;
    background:linear-gradient(90deg,transparent,rgba(206,129,0,.35),transparent);
    transform:scaleX(0);animation:draw 1.1s cubic-bezier(.2,.7,.2,1) .7s forwards}
  .flash::after{content:"";position:absolute;inset:0;width:40%;
    background:linear-gradient(90deg,transparent,var(--gold-light),#fff3d6,var(--gold-light),transparent);
    transform:translateX(-120%);animation:sweep 1.3s ease-out 1.2s forwards}
  p.lead{font-size:clamp(17px,4.6vw,21px);line-height:1.5;color:var(--ink-soft);max-width:31ch;
    opacity:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) .45s forwards}
  p.lead span{display:block}
  .contact{margin-top:36px;opacity:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) .6s forwards}
  .contact span{display:block;font-size:13px;color:var(--muted);margin-bottom:10px}
  .contact a{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:12px 22px;border-radius:999px;
    color:var(--ink);text-decoration:none;font-weight:600;font-size:16px;
    background:rgba(255,255,255,.72);border:1px solid var(--line);
    box-shadow:0 1px 2px rgba(14,21,67,.04),0 8px 24px rgba(14,21,67,.06);
    -webkit-backdrop-filter:saturate(180%) blur(12px);backdrop-filter:saturate(180%) blur(12px);
    transition:transform .2s ease,box-shadow .2s ease}
  .contact a:hover{transform:translateY(-1px);box-shadow:0 2px 4px rgba(14,21,67,.05),0 12px 30px rgba(14,21,67,.09)}
  .contact a:focus-visible{outline:3px solid var(--gold-light);outline-offset:3px}
  .contact svg{width:18px;height:18px;flex:none}
  footer{padding:20px 24px 28px;text-align:center;font-size:11.5px;line-height:1.6;color:var(--muted);
    border-top:1px solid var(--line)}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes draw{to{transform:scaleX(1)}}
  @keyframes sweep{to{transform:translateX(320%)}}
  @media (max-width:600px){
    .logo{width:min(84vw,340px);margin-bottom:40px}
    h1{font-size:clamp(27px,7.9vw,32px);letter-spacing:-.02em;line-height:1.12}
    .flash{margin:20px auto 22px}
    p.lead{font-size:clamp(16px,4.4vw,18px);line-height:1.55;max-width:none}
  }
  @media (min-width:900px){
    main{padding:72px 24px 56px}
    .logo{width:360px;margin-bottom:56px}
    footer{font-size:12px}
    p.lead{max-width:40ch}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;opacity:1!important;transform:none!important;transition:none!important}
    .flash::after{display:none}
  }
</style>
</head>
<body>
  <main>
    <img class="logo" src="rooicapital-logo.png" width="974" height="255" alt="ROOIcapital® Servicios Financieros">
    <h1>Sitio en construcción</h1>
    <div class="flash" aria-hidden="true"></div>
    <p class="lead"><span>Lo nuevo está en camino.</span><span>Prepárate, esto apenas comienza.</span></p>
    <div class="contact">
      <span>Contacto</span>
      <a href="mailto:contacto@rooicapital.com">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m4 7 8 6 8-6"/></svg>
        contacto@rooicapital.com
      </a>
    </div>
  </main>
  <footer>
    <p>ROOI NETWORK CAPITAL, S.A.P.I. de C.V., SOFOM, E.N.R.</p>
    <p>© 2026 ROOIcapital®. Todos los derechos reservados.</p>
  </footer>
</body>
</html>
